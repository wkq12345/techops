apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: techops-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: techops-frontend
  template:
    metadata:
      labels:
        app: techops-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: techops-k8s-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx
          configMap:
            name: techops-nginx
