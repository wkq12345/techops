apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: techops-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # The helper scales up only after migration and initial seeding succeed.
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: techops-backend
  template:
    metadata:
      labels:
        app: techops-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: techops-k8s-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: techops-config}
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef: {name: techops-secrets, key: APP_KEY}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: techops-secrets, key: DB_PASSWORD}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /up, port: 8000}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /up, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /up, port: 8000}
            periodSeconds: 10
