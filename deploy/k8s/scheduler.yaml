apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduler
spec:
  schedule: "* * * * *"
  timeZone: Asia/Kuala_Lumpur
  concurrencyPolicy: Forbid
  suspend: true
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: scheduler
              image: techops-k8s-backend:local
              imagePullPolicy: Never
              command: [php, artisan, schedule:run, --no-interaction]
              envFrom:
                - configMapRef: {name: techops-config}
              env:
                - name: APP_KEY
                  valueFrom:
                    secretKeyRef: {name: techops-secrets, key: APP_KEY}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: techops-secrets, key: DB_PASSWORD}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 500m, memory: 256Mi}
