apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: techops-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: techops-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: techops-postgres
  template:
    metadata:
      labels:
        app: techops-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: techops-config, key: DB_DATABASE}
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: techops-config, key: DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: techops-secrets, key: DB_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            exec: {command: [pg_isready, -U, techops_learning, -d, techops_learning]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, techops_learning, -d, techops_learning]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, techops_learning, -d, techops_learning]}
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: techops-postgres-data
